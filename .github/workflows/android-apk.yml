name: Android APK

on:
  push:
    branches:
      - main
      - 'feat/**'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'APK variant to build'
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare release signing material
        if: env.BUILD_TYPE == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.AKEER14_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.AKEER14_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.AKEER14_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.AKEER14_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing AKEER14_KEYSTORE_BASE64 repository secret'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing AKEER14_KEY_ALIAS repository secret'; exit 1; }
          test -n "$STORE_PASSWORD" || { echo 'Missing AKEER14_STORE_PASSWORD repository secret'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing AKEER14_KEY_PASSWORD repository secret'; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/android/app/akeer14-release.keystore"
          {
            echo "AKEER14_KEYSTORE_FILE=$GITHUB_WORKSPACE/android/app/akeer14-release.keystore"
            echo "AKEER14_KEY_ALIAS=$KEY_ALIAS"
            echo "AKEER14_STORE_PASSWORD=$STORE_PASSWORD"
            echo "AKEER14_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew :app:assembleRelease --no-daemon
          else
            ./gradlew :app:assembleDebug --no-daemon
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: surveillance-${{ env.BUILD_TYPE }}-apk
          path: android/app/build/outputs/apk/${{ env.BUILD_TYPE }}/*.apk
          if-no-files-found: error
          retention-days: 14
